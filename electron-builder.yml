# electron-builder configuration.
#
# Binary transparency goals: dependency versions are pinned in package.json
# (no ^/~ ranges), and the artifact name is timestamp-free so two builds of the
# same source produce identically-named outputs. After building, run
# `npm run checksums` to emit a signable checksums.txt manifest.
appId: org.harbor.browser
productName: Harbor
copyright: Harbor contributors

directories:
  output: release
  buildResources: build

# Ship only the compiled output and production deps — never source or dev tooling.
files:
  - dist/**/*
  - package.json
  - '!**/*.map'

# Deterministic, timestamp-free artifact names aid reproducibility checks.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Pin to the source-of-truth Electron from devDependencies rather than
# downloading an unpinned build at package time.
electronVersion: 31.2.1

# Windows-only for now (per project scope). macOS/Linux targets can be added
# back here when those clients are in scope.
win:
  target:
    - nsis
  icon: build/icon.ico
  # Skip the rcedit/sign pass. It pulls in winCodeSign, whose archive contains
  # macOS symlinks that fail to extract on Windows without the "create symbolic
  # links" privilege (Developer Mode/admin), and it needs wine on Linux. The
  # installer wizard, shortcuts, Add/Remove entry, and the running app window
  # all use build/icon.ico/png regardless; only the raw Harbor.exe file
  # thumbnail keeps the default Electron icon. To fully brand the exe, build with
  # Windows Developer Mode enabled and remove this line.
  signAndEditExecutable: false

# Sleek one-click branded installer (no wizard pages). It shows the Harbor
# icon and a progress UI, installs per-user (no admin), and launches the app.
# To switch back to the assisted wizard, set oneClick:false and re-add
# allowToChangeInstallationDirectory + the installerSidebar/Header bitmaps
# (generated by scripts/make-installer-art.mjs).
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Harbor
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
