# electron-builder configuration.
#
# Binary transparency goals: dependency versions are pinned in package.json
# (no ^/~ ranges), and the artifact name is timestamp-free so two builds of the
# same source produce identically-named outputs. After building, run
# `npm run checksums` to emit a signable checksums.txt manifest.
appId: org.harbor.browser
productName: Harbor
copyright: Harbor contributors

directories:
  output: release
  buildResources: build

# Ship only the compiled output and production deps — never source or dev tooling.
files:
  - dist/**/*
  - package.json
  - '!**/*.map'

# Deterministic, timestamp-free artifact names aid reproducibility checks.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Pin to the source-of-truth Electron from devDependencies rather than
# downloading an unpinned build at package time.
electronVersion: 31.2.1

linux:
  target:
    - AppImage
    - tar.gz
  category: Network

win:
  target:
    - nsis
  icon: build/icon.ico
  # Skip the rcedit/sign pass (which needs wine when building from Linux). The
  # produced exe keeps the default version metadata and Electron icon (embedding
  # a custom exe icon needs rcedit/wine); the installer, shortcuts, and the
  # running window all use build/icon.ico/png regardless. For a fully branded,
  # signed exe, build on Windows (or with wine) and remove this line.
  signAndEditExecutable: false

# A friendly installer the recipient can double-click. Not one-click, so they
# can pick the install location; per-user so it needs no admin rights.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Harbor
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.productivity
