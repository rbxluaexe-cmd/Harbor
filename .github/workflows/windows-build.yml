name: Build Windows Installer

# Two ways to trigger:
#  • "Run workflow" button (workflow_dispatch) — builds and uploads the
#    installer as a downloadable artifact on the run page.
#  • Pushing a tag like v0.1.0 — builds and publishes a GitHub Release with the
#    installer attached as a download.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create a Release on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          gh release create "$env:GITHUB_REF_NAME" "$($exe.FullName)" `
            --title "Harbor $env:GITHUB_REF_NAME" `
            --notes "Automated Windows build. Unsigned installer: on first run Windows SmartScreen shows ""Windows protected your PC"" — click More info, then Run anyway. Per-user install, no admin required."
