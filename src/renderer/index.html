<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Custom frameless title bar: tabs live here, window controls on the right -->
    <header id="titlebar">
      <div id="brand" title="Harbor">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <circle cx="128" cy="58" r="17" fill="none" stroke="currentColor" stroke-width="14" />
          <rect x="120" y="64" width="16" height="134" />
          <rect x="84" y="92" width="88" height="16" />
          <path d="M66 150 a62 62 0 0 0 124 0" fill="none" stroke="currentColor" stroke-width="16" />
          <path d="M44 150 l30 6 l-14 28 z" />
          <path d="M212 150 l-30 6 l14 28 z" />
        </svg>
      </div>
      <div id="tabs"></div>
      <button id="newtab" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
      </button>
      <div id="drag"></div>
      <div id="winctrls">
        <button data-win="min" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
        </button>
        <button data-win="max" title="Maximize" aria-label="Maximize">
          <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" /></svg>
        </button>
        <button data-win="close" title="Close" aria-label="Close">
          <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </div>
    </header>

    <!-- Vertical-tabs sidebar (shown when enabled) -->
    <aside id="sidebar">
      <button id="vnewtab" title="New tab (Ctrl+T)">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        <span>New tab</span>
      </button>
      <div id="vtabs"></div>
    </aside>

    <div id="toolbar"></div>

    <div id="bookmarksbar" hidden></div>

    <div id="findbar" hidden></div>
    <div id="downloads" hidden></div>

    <aside id="panel" hidden></aside>

    <script type="module" src="./index.js"></script>
  </body>
</html>
