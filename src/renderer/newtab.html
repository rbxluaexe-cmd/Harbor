<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Local start page. No remote code; the search form just navigates. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; form-action https:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #e2e8f0;
        background:
          radial-gradient(1200px 600px at 50% -10%, #14304f 0%, transparent 60%),
          #0b1220;
        user-select: none;
      }
      .mark { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .logo {
        width: 84px; height: 84px; border-radius: 22px;
        background: linear-gradient(160deg, #38bdf8, #075985);
        display: grid; place-items: center;
        box-shadow: 0 12px 40px rgba(56, 189, 248, 0.25);
      }
      .logo svg { width: 52px; height: 52px; fill: #f8fafc; }
      .wordmark { font-size: 30px; font-weight: 700; letter-spacing: 0.06em; }
      .tagline { color: #64748b; font-size: 13px; margin-top: -8px; }
      form { width: min(620px, 86vw); position: relative; }
      input {
        width: 100%; padding: 15px 20px; border-radius: 30px;
        border: 1px solid #1e293b; background: #0f172a; color: #e2e8f0;
        font-size: 16px; outline: none; user-select: text;
      }
      input:focus { border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56,189,248,0.12); }
      .hint { color: #475569; font-size: 12px; text-align: center; }
      .links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      .links a {
        color: #cbd5e1; text-decoration: none; font-size: 13px;
        padding: 8px 14px; border-radius: 18px; background: #0f172a; border: 1px solid #1e293b;
      }
      .links a:hover { border-color: #334155; color: #fff; }
    </style>
  </head>
  <body>
    <div class="mark">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 256 256">
          <circle cx="128" cy="58" r="17" fill="none" stroke="#f8fafc" stroke-width="14" />
          <rect x="120" y="64" width="16" height="134" />
          <rect x="84" y="92" width="88" height="16" />
          <path d="M66 150 a62 62 0 0 0 124 0" fill="none" stroke="#f8fafc" stroke-width="16" />
          <path d="M44 150 l30 6 l-14 28 z" />
          <path d="M212 150 l-30 6 l14 28 z" />
        </svg>
      </div>
      <div class="wordmark">Harbor</div>
      <div class="tagline">private by default</div>
    </div>

    <form action="https://duckduckgo.com/" method="get" autocomplete="off">
      <input
        type="text"
        name="q"
        placeholder="Search privately or type a URL in the address bar"
        autofocus
        spellcheck="false"
      />
    </form>

    <div class="links">
      <a href="https://duckduckgo.com/">DuckDuckGo</a>
      <a href="https://en.wikipedia.org/">Wikipedia</a>
      <a href="https://github.com/">GitHub</a>
    </div>

    <div class="hint">Tip: Ctrl+T new tab · Ctrl+L address bar · 🛡 toggles the privacy panel</div>
  </body>
</html>
